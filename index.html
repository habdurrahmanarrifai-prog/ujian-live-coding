<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login ke akun anda</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="login-card" method="post" action="#">
    <h1>Login ke akun anda</h1>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required placeholder="Masukkan email">
    
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required placeholder="Masukkan password">

     <input id="ingat" name="ingat" type="checkbox">
      <label for="ingat" style="margin-bottom:0;">Ingat Saya</label>

      <button type="submit">Masuk</button>

    <p class="register-link">
      Belum punya akun? <a href="#">Daftar di sini</a>
      <p>
        </form>

    



</body>
</html>
